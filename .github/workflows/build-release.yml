name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Both apps target net10.0-windows (WinForms GUI, System.Drawing
    # thumbnailing), so this has to be a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release name
        id: name
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          "tag=simpledlna-$stamp"  >> $env:GITHUB_OUTPUT
          "stamp=$stamp"           >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The admin web UI is built by npm and embedded into SimpleDlna.Admin by
      # admin.csproj. Installing the packages here means the MSBuild target only
      # has to run `npm run build`, and the cache keeps that quick.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Restore
        run: dotnet restore sdlna.sln

      - name: Build
        run: dotnet build sdlna.sln -c Release --no-restore

      # Self-contained so the download runs on a machine with no .NET installed.
      # Deliberately not trimmed and not single-file: ThumbnailMaker discovers
      # loaders via Assembly.GetTypes, ItemSerializer and GetOptNet both work
      # through reflection, and System.Data.SQLite needs its native
      # SQLite.Interop.dll on disk next to the managed assembly.
      - name: Publish console server
        run: >
          dotnet publish sdlna/sdlna.csproj
          -c Release -r win-x64 --self-contained true
          -p:VersionSuffix=${{ steps.name.outputs.stamp }}
          -o publish/console

      - name: Publish GUI
        run: >
          dotnet publish SimpleDLNA/SimpleDLNA.csproj
          -c Release -r win-x64 --self-contained true
          -p:VersionSuffix=${{ steps.name.outputs.stamp }}
          -o publish/gui

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & publish\console\sdlna.exe --version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "sdlna.exe --version exited $LASTEXITCODE" }
          if ($out -notmatch 'Version:') { throw "unexpected --version output" }

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ steps.name.outputs.tag }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem publish -Recurse -Include *.pdb | Remove-Item -Force
          Compress-Archive -Path publish\console\* -DestinationPath "dist\$tag-console-win-x64.zip"
          Compress-Archive -Path publish\gui\*     -DestinationPath "dist\$tag-gui-win-x64.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.tag }}
          path: dist/*.zip

      - name: Create release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: dist/*.zip
          body: |
            Automated build of `${{ github.sha }}`.

            Both downloads are self-contained for Windows x64 — unzip and run,
            no .NET runtime install required.

            | Download | Contents |
            | --- | --- |
            | `${{ steps.name.outputs.tag }}-console-win-x64.zip` | `sdlna.exe` — command line server |
            | `${{ steps.name.outputs.tag }}-gui-win-x64.zip` | `SimpleDLNA.exe` — tray app; manage it at http://localhost:19199/ |

            Both builds serve the admin web interface on
            `http://localhost:19199/`, bound to loopback only.

            Video thumbnails additionally require `ffmpeg` on `PATH`.
